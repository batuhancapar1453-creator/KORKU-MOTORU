name: KORKU MOTORU - Orijinal Motor Render Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasini ac ve kontrol et
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Ana dizinde ZIP dosyasi bulunamadi."
            exit 1
          fi

          echo "Acilan dosya: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          ENGINE="extracted/KORKU_MOTORU/engine"
          STORY="extracted/KORKU_MOTORU/stories/gece-vardiyasi"

          test -f "$ENGINE/package.json" || { echo "Motor package.json bulunamadi"; find extracted -name package.json -print; exit 1; }
          test -f "$ENGINE/render.mjs" || { echo "render.mjs bulunamadi"; exit 1; }
          test -f "$STORY/story.js" || { echo "gece-vardiyasi/story.js bulunamadi"; find extracted/KORKU_MOTORU/stories -maxdepth 3 -type f -print; exit 1; }

          echo "Motor ve hikaye dosyalari bulundu."
          echo "Chrome baslatma kodu orijinal Puppeteer akisinda birakilacak."

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extracted/KORKU_MOTORU/engine/package.json

      - name: Chrome kur
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Linux Chrome uyumluluk sarmalayicisi
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail

          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            echo "HATA: Chrome bulunamadi: ${CHROME_BIN:-bos}"
            exit 1
          fi

          sudo tee /usr/local/bin/chrome-github > /dev/null <<EOF
          #!/bin/sh
          exec "$CHROME_BIN" --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage "$@"
          EOF

          sudo chmod +x /usr/local/bin/chrome-github
          echo "Chrome sarmalayicisi hazir."

      - name: FFmpeg kur
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Motor bagimliliklarini yukle
        working-directory: extracted/KORKU_MOTORU/engine
        run: npm install --no-audit --no-fund

      - name: Orijinal Puppeteer render akisini calistir
        working-directory: extracted/KORKU_MOTORU/engine
        env:
          CHROME_PATH: /usr/local/bin/chrome-github
        shell: bash
        run: |
          set -euo pipefail
          node render.mjs gece-vardiyasi --stills=1,5,10,16,23,30,37 --scale=0.5 2>&1 | tee render-test.log

      - name: Test ciktisini ve loglari kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korku-motoru-orijinal-render-testi
          path: |
            extracted/KORKU_MOTORU/stories/gece-vardiyasi/out/**
            extracted/KORKU_MOTORU/engine/render-test.log
          if-no-files-found: warn
          retention-days: 7
