name: Yumurta-Stili / KORKU MOTORU - Render

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Hikâye klasörü (KORKU için gece-vardiyasi, örnek için is-odasi)"
        required: false
        default: "is-odasi"
        type: string

permissions:
  contents: read

concurrency:
  group: yumurta-stili-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Saglam ZIP dosyasini bul, ac ve hikayeyi belirle
        id: project
        shell: bash
        env:
          REQUESTED_STORY: ${{ inputs.story }}
        run: |
          set -euo pipefail

          EXTRACT_DIR="$GITHUB_WORKSPACE/extracted"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          ROOT=""
          SELECTED_ZIP=""

          # Once depodaki ZIP dosyalarini kontrol et. Bozuk olanlari atla.
          shopt -s nullglob
          for archive in "$GITHUB_WORKSPACE"/*.zip; do
            [ -f "$archive" ] || continue
            echo "ZIP kontrol ediliyor: $(basename "$archive")"

            if ! unzip -tq "$archive" >/dev/null 2>&1; then
              echo "Bozuk ZIP atlandi: $(basename "$archive")"
              continue
            fi

            if ! unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)engine/render\.mjs$'; then
              echo "Yumurta-Stili motoru bulunmayan ZIP atlandi: $(basename "$archive")"
              continue
            fi

            SELECTED_ZIP="$archive"
            echo "Gecerli motor ZIP'i secildi: $(basename "$archive")"
            unzip -oq "$SELECTED_ZIP" -d "$EXTRACT_DIR"
            break
          done
          shopt -u nullglob

          # ZIP acildiktan sonra motorun gercek kok klasorunu bul.
          if [ -n "$SELECTED_ZIP" ]; then
            RENDER_FILE="$(find "$EXTRACT_DIR" -type f -path '*/engine/render.mjs' -print -quit)"
            if [ -n "$RENDER_FILE" ]; then
              ROOT="$(dirname "$(dirname "$RENDER_FILE")")"
            fi
          fi

          # ZIP yoksa, depoda dogrudan bulunan proje klasorlerini de kontrol et.
          if [ -z "$ROOT" ]; then
            for candidate in \
              "$GITHUB_WORKSPACE/KORKU_MOTORU" \
              "$GITHUB_WORKSPACE/yumurta-stili-main" \
              "$GITHUB_WORKSPACE"; do
              if [ -f "$candidate/engine/render.mjs" ]; then
                ROOT="$candidate"
                break
              fi
            done
          fi

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/engine/render.mjs" ]; then
            echo "::error::Gecerli ZIP bulunamadi veya ZIP icinde engine/render.mjs yok. Depodaki ZIP dosyalarini kontrol edin."
            echo "Depodaki ZIP dosyalari:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' || true
            exit 1
          fi

          STORY="${REQUESTED_STORY:-is-odasi}"
          if [ ! -f "$ROOT/stories/$STORY/story.js" ]; then
            if [ -f "$ROOT/stories/gece-vardiyasi/story.js" ]; then
              STORY="gece-vardiyasi"
            elif [ -f "$ROOT/stories/is-odasi/story.js" ]; then
              STORY="is-odasi"
            else
              echo "::error::Gecerli hikaye bulunamadi: $ROOT/stories/$STORY/story.js"
              find "$ROOT/stories" -mindepth 1 -maxdepth 2 -type f -name story.js -printf '%h\n' || true
              exit 1
            fi
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "story=$STORY" >> "$GITHUB_OUTPUT"
          echo "Proje kok dizini: $ROOT"
          echo "Secilen hikaye: $STORY"
          if [ -n "$SELECTED_ZIP" ]; then
            echo "Kullanilan ZIP: $(basename "$SELECTED_ZIP")"
          else
            echo "Proje ZIP disindan bulundu."
          fi

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg ve temel paketleri kur
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Chrome kur
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Chrome için headless başlatma sarmalayıcısı
        shell: bash
        env:
          REAL_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test -x "$REAL_CHROME"
          WRAPPER="$RUNNER_TEMP/chrome-headless"
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage "$@"\n' "$REAL_CHROME" > "$WRAPPER"
          chmod +x "$WRAPPER"
          echo "CHROME_PATH=$WRAPPER" >> "$GITHUB_ENV"
          "$WRAPPER" --version

      - name: Node paketlerini kur
        working-directory: ${{ steps.project.outputs.root }}/engine
        run: npm ci --no-audit --no-fund

      - name: Ses miksleme bağımlılığını kur
        run: python -m pip install --upgrade pip numpy

      - name: Hikâye ve motor dosyalarını doğrula
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
          STORY: ${{ steps.project.outputs.story }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_ROOT/engine/render.mjs"
          test -f "$PROJECT_ROOT/engine/index.html"
          test -f "$PROJECT_ROOT/stories/$STORY/story.js"
          test -f "$PROJECT_ROOT/stories/$STORY/voice/voice.wav" || echo "UYARI: voice.wav yok; video sessiz üretilecek."
          echo "Motor ve hikâye dosyaları bulundu."

      - name: Ses zamanlamalarını çıkar
        working-directory: ${{ steps.project.outputs.root }}/engine
        env:
          STORY: ${{ steps.project.outputs.story }}
        run: node render.mjs "$STORY" --cues

      - name: Müzik ve efektleri sesle birleştir
        working-directory: ${{ steps.project.outputs.root }}/engine
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
          STORY: ${{ steps.project.outputs.story }}
        shell: bash
        run: |
          set -euo pipefail
          STORY_DIR="$PROJECT_ROOT/stories/$STORY"
          if [ -f "$STORY_DIR/voice/voice.wav" ] && [ -f "$STORY_DIR/audio/cues.json" ]; then
            python audio/mix.py "$STORY_DIR"
          else
            echo "Ses dosyası veya cues.json yok; miksleme atlandı."
          fi

      - name: Videoyu render et
        working-directory: ${{ steps.project.outputs.root }}/engine
        env:
          STORY: ${{ steps.project.outputs.story }}
        run: node render.mjs "$STORY"

      - name: Oluşan videoyu ve render kayıtlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ steps.project.outputs.story }}
          path: |
            ${{ steps.project.outputs.root }}/stories/${{ steps.project.outputs.story }}/out/
          if-no-files-found: warn
          retention-days: 7
