name: KORKU MOTORU - Otomatik Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 7 * * *'

permissions:
  contents: write

concurrency:
  group: korku-motoru-otomatik-yayin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Proje ve motoru bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          if [ -f "$ROOT/engine/render.mjs" ] && [ -f "$ROOT/automation/prepare_episode.py" ]; then
            echo "Motor doğrudan depoda bulundu."
          else
            ARCHIVE=$(find "$GITHUB_WORKSPACE" -type f -iname 'KORKU_MOTORU_OTOMATIK_PAKET*.zip' -print | sort -V | tail -n 1)

            if [ -z "$ARCHIVE" ]; then
              echo "::error::KORKU_MOTORU_OTOMATIK_PAKET*.zip bulunamadı."
              find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -print
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi

            echo "Kullanılacak ZIP: $ARCHIVE"

            mkdir -p "$GITHUB_WORKSPACE/extracted"
            unzip -oq "$ARCHIVE" -d "$GITHUB_WORKSPACE/extracted"

            ENGINE_FILE=$(find "$GITHUB_WORKSPACE/extracted" -type f -path '*/engine/render.mjs' -print -quit)

            if [ -z "$ENGINE_FILE" ]; then
              echo "::error::ZIP içinde engine/render.mjs bulunamadı."
              find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | head -100
              exit 1
            fi

            ROOT="${ENGINE_FILE%/engine/render.mjs}"
          fi

          for FILE in \
            "$ROOT/engine/render.mjs" \
            "$ROOT/automation/prepare_episode.py" \
            "$ROOT/automation/upload_youtube.py" \
            "$ROOT/automation/queue.json"
          do
            if [ ! -f "$FILE" ]; then
              echo "::error::Gerekli dosya bulunamadı: $FILE"
              exit 1
            fi
          done

          echo "Proje kökü: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Kalıcı yayın kuyruğunu hazırla
        id: episode
        env:
          ROOT: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/automation"
          STATE="$GITHUB_WORKSPACE/automation/queue.json"

          if [ ! -f "$STATE" ]; then
            cp "$ROOT/automation/queue.json" "$STATE"
          fi

          N=$(python -c "import json;print(json.load(open('$STATE'))['next_episode'])")

          if [ "$N" -gt 10 ]; then
            echo "10 bölümlük sezon tamamlandı."
            echo "done=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "episode=$N" >> "$GITHUB_OUTPUT"
          echo "done=false" >> "$GITHUB_OUTPUT"

      - name: Tamamlanan sezonu durdur
        if: steps.episode.outputs.done == 'true'
        run: echo 'Yayın kuyruğu güvenli biçimde durduruldu.'

      - name: Node.js ve Python kur
        if: steps.episode.outputs.done != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python ortamı
        if: steps.episode.outputs.done != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg kur
        if: steps.episode.outputs.done != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Chrome kur
        if: steps.episode.outputs.done != 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Chrome başlatma sarmalayıcısı
        if: steps.episode.outputs.done != 'true'
        env:
          REAL_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          test -x "$REAL_CHROME"

          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage "$@"\n' "$REAL_CHROME" > "$RUNNER_TEMP/chrome-headless"

          chmod +x "$RUNNER_TEMP/chrome-headless"
          echo "CHROME_PATH=$RUNNER_TEMP/chrome-headless" >> "$GITHUB_ENV"

      - name: Node paketleri ve Python bağımlılıkları
        if: steps.episode.outputs.done != 'true'
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix "$ROOT/engine"
          python -m pip install --upgrade pip
          python -m pip install numpy edge-tts google-api-python-client google-auth

      - name: YouTube bağlantısını render öncesi doğrula
        if: steps.episode.outputs.done != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for key in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::GitHub Secret eksik: $key"
              exit 1
            fi
          done

      - name: Bölüm sesini ve zamanlamalarını üret
        if: steps.episode.outputs.done != 'true'
        env:
          ROOT: ${{ steps.project.outputs.root }}
          EPISODE: ${{ steps.episode.outputs.episode }}
        run: |
          python "$ROOT/automation/prepare_episode.py" "$EPISODE"

      - name: Render öncesi dosyaları doğrula
        if: steps.episode.outputs.done != 'true'
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          test -f "$ROOT/stories/son-gorulme/story.js"
          test -s "$ROOT/stories/son-gorulme/voice/voice.wav"
          test -s "$ROOT/stories/son-gorulme/voice/words.json"

      - name: Ses efektleri ve sahne ipuçlarını çıkar
        if: steps.episode.outputs.done != 'true'
        working-directory: ${{ steps.project.outputs.root }}/engine
        run: node render.mjs son-gorulme --cues

      - name: Özgün müzik ve ses efektlerini üret
        if: steps.episode.outputs.done != 'true'
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: python "$ROOT/engine/audio/mix.py" "$ROOT/stories/son-gorulme"

      - name: 1080x1920 videoyu render et
        if: steps.episode.outputs.done != 'true'
        working-directory: ${{ steps.project.outputs.root }}/engine
        run: node render.mjs son-gorulme

      - name: Hedef yayın saatini bekle
        if: steps.episode.outputs.done != 'true' && github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SCHEDULE" = '30 4 * * *' ]; then
            TARGET_HOUR=06
          else
            TARGET_HOUR=09
          fi

          TARGET=$(date -u -d "$(date -u +%F) ${TARGET_HOUR}:00:00" +%s)
          NOW=$(date -u +%s)

          if [ "$NOW" -lt "$TARGET" ]; then
            WAIT=$((TARGET-NOW))
            echo "Hedef yayın saatine kadar ${WAIT} saniye beklenecek."
            sleep "$WAIT"
          else
            echo "Render hedef saati geçti; video hazır olduğu için hemen yüklenecek."
          fi

      - name: YouTube'a herkese açık yükle
        if: steps.episode.outputs.done != 'true'
        env:
          ROOT: ${{ steps.project.outputs.root }}
          EPISODE: ${{ steps.episode.outputs.episode }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python "$ROOT/automation/upload_youtube.py" "$EPISODE"

      - name: Bölüm kuyruğunu güncelle ve kaydet
        if: steps.episode.outputs.done != 'true'
        env:
          EPISODE: ${{ steps.episode.outputs.episode }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os

          p = 'automation/queue.json'
          with open(p, encoding='utf-8') as f:
              d = json.load(f)

          n = int(os.environ['EPISODE'])
          if d['next_episode'] != n:
              raise SystemExit('Kuyruk değişti; güvenlik için commit iptal edildi')

          d['completed'].append(n)
          d['next_episode'] = n + 1

          with open(p, 'w', encoding='utf-8') as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/queue.json
          git commit -m "KORKU MOTORU: bölüm $EPISODE yayınlandı"
          git push

      - name: Render çıktısını sakla
        if: always() && steps.episode.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: korku-motoru-bolum-${{ steps.episode.outputs.episode }}
          path: ${{ steps.project.outputs.root }}/stories/son-gorulme/out/
          if-no-files-found: warn
          retention-days: 7
