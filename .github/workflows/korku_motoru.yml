name: KORKU MOTORU

on:
  workflow_dispatch:
  schedule:
    # Her gün 20:00 Türkiye saati (17:00 UTC)
    - cron: '0 17 * * *'

permissions:
  contents: write

concurrency:
  group: korku-motoru
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Düzeltilmiş kaynak ZIP dosyasını aç
        run: |
          test -f KORKU_MOTORU_BATU_KAYNAK_DUZELTILMIS.zip
          unzip -oq KORKU_MOTORU_BATU_KAYNAK_DUZELTILMIS.zip -d .
          test -f KORKU_MOTORU/run.py
          test -f KORKU_MOTORU/korku_motoru/engine.py
          test -f KORKU_MOTORU/korku_motoru/stories/video_001.json

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Bağımlılıkları kur
        working-directory: KORKU_MOTORU
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python ve hikâye kontrolü
        working-directory: KORKU_MOTORU
        run: |
          python -m compileall -q korku_motoru run.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('korku_motoru/stories/video_001.json').read_text(encoding='utf-8'))
          assert len(d['scenes']) == 45, 'Sahne sayısı 45 değil'
          assert d['duration_seconds'] == 180, 'Süre 180 saniye değil'
          assert d['character'] == 'Batu', 'Karakter adı Batu değil'
          print('Kod ve hikâye kontrolleri başarılı.')
          PY

      - name: Video üret
        working-directory: KORKU_MOTORU
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python run.py

      - name: Çıktıları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korku-motoru-output
          path: KORKU_MOTORU/output/
          if-no-files-found: ignore
          retention-days: 7
