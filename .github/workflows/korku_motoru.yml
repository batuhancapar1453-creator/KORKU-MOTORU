name: KORKU MOTORU

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,9 * * *' # 09:00 ve 12:00 Türkiye saati (UTC+3)

permissions:
  contents: write

concurrency:
  group: korku-motoru-yayin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Kaynak ZIP dosyasını aç
        run: |
          test -f KORKU_MOTORU_BATU_DUZELTILMIS_v4.zip
          unzip -oq KORKU_MOTORU_BATU_DUZELTILMIS_v4.zip -d .
          test -f KORKU_MOTORU/run.py
          test -f KORKU_MOTORU/korku_motoru/engine.py
          test -f KORKU_MOTORU/korku_motoru/stories/QUEUE.json

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: KORKU_MOTORU/requirements.txt

      - name: FFmpeg ve fontları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Bağımlılıkları kur
        working-directory: KORKU_MOTORU
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Önceki görselleri ve klipleri geri yükle
        uses: actions/cache/restore@v4
        with:
          path: |
            KORKU_MOTORU/output/images/
            KORKU_MOTORU/output/clips/
          key: korku-motoru-${{ hashFiles('KORKU_MOTORU/korku_motoru/stories/*.json') }}-${{ github.run_id }}
          restore-keys: |
            korku-motoru-${{ hashFiles('KORKU_MOTORU/korku_motoru/stories/*.json') }}-

      - name: Kod ve 20 hikâye kontrolü
        working-directory: KORKU_MOTORU
        run: |
          python -m compileall -q korku_motoru run.py
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('korku_motoru/stories/QUEUE.json').read_text(encoding='utf-8'))
          assert len(q)==20, f'20 hikâye bekleniyordu, bulunan: {len(q)}'
          for item in q:
              p=Path('korku_motoru/stories')/(item['id']+'.json')
              assert p.exists(), f'Eksik hikâye: {p}'
              d=json.loads(p.read_text(encoding='utf-8'))
              if 'beats' in d: assert len(d['beats'])==15 and all(len(b['narration'])==3 for b in d['beats'])
              else: assert len(d['scenes'])==45
              assert d['duration_seconds']==180 and d['character']=='Batu'
          print('20 hikâye, karakter ve süre kontrolleri başarılı.')
          PY

      - name: YouTube OAuth ön kontrolü
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          keys=['YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN']
          missing=[k for k in keys if not os.getenv(k,'').strip()]
          if missing: raise SystemExit('Eksik GitHub Secrets: '+', '.join(missing))
          r=requests.post('https://oauth2.googleapis.com/token',data={'grant_type':'refresh_token','client_id':os.environ['YOUTUBE_CLIENT_ID'],'client_secret':os.environ['YOUTUBE_CLIENT_SECRET'],'refresh_token':os.environ['YOUTUBE_REFRESH_TOKEN']},timeout=30)
          j=r.json()
          if not r.ok or not j.get('access_token'): raise SystemExit('YouTube OAuth başarısız: '+str(j.get('error_description',j.get('error'))))
          print('YouTube OAuth bağlantısı başarılı.')
          PY

      - name: Sıradaki hikâyeyi üret ve YouTube’a yükle
        working-directory: KORKU_MOTORU
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-4b'
          IMAGE_WORKERS: '4'
          TTS_VOICE: 'tr-TR-AhmetNeural'
          TTS_RATE: '-7%'
          TTS_PITCH: '-3Hz'
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python run.py --next

      - name: Üretim önbelleğini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            KORKU_MOTORU/output/images/
            KORKU_MOTORU/output/clips/
          key: korku-motoru-${{ hashFiles('KORKU_MOTORU/korku_motoru/stories/*.json') }}-${{ github.run_id }}

      - name: Çıktıları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korku-motoru-output-${{ github.run_id }}
          path: KORKU_MOTORU/output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Yayın geçmişini depoya kaydet
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f KORKU_MOTORU/data/history.json
          git diff --cached --quiet || git commit -m 'Korku Motoru: yayın geçmişi güncellendi'
          git push
