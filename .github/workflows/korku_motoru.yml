name: KORKU MOTORU

on:
  workflow_dispatch:
  schedule:
    # Her gün 20:00 Türkiye saati (17:00 UTC)
    - cron: '0 17 * * *'

permissions:
  contents: write

concurrency:
  group: korku-motoru
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 45 sahne görseli + 45 klip + ses/video birleştirme için geniş süre.
    timeout-minutes: 180
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Düzeltilmiş kaynak ZIP dosyasını aç
        run: |
          test -f KORKU_MOTORU_BATU_DUZELTILMIS_v3.zip
          unzip -oq KORKU_MOTORU_BATU_DUZELTILMIS_v3.zip -d .
          test -f KORKU_MOTORU/run.py
          test -f KORKU_MOTORU/korku_motoru/engine.py
          test -f KORKU_MOTORU/korku_motoru/stories/video_001.json

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: KORKU_MOTORU/requirements.txt

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Bağımlılıkları kur
        working-directory: KORKU_MOTORU
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Her çalıştırmada önceki başarılı/yarım kalmış görseller ve klipler geri gelir.
      - name: Önceki üretim dosyalarını geri yükle
        uses: actions/cache/restore@v4
        with:
          path: |
            KORKU_MOTORU/output/images/
            KORKU_MOTORU/output/clips/
          key: korku-motoru-${{ hashFiles('KORKU_MOTORU/korku_motoru/stories/*.json') }}-${{ github.run_id }}
          restore-keys: |
            korku-motoru-${{ hashFiles('KORKU_MOTORU/korku_motoru/stories/*.json') }}-

      - name: Python ve hikâye kontrolü
        working-directory: KORKU_MOTORU
        run: |
          python -m compileall -q korku_motoru run.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('korku_motoru/stories/video_001.json').read_text(encoding='utf-8'))
          assert len(d['scenes']) == 45, 'Sahne sayısı 45 değil'
          assert d['duration_seconds'] == 180, 'Süre 180 saniye değil'
          assert d['character'] == 'Batu', 'Karakter adı Batu değil'
          assert [s['n'] for s in d['scenes']] == list(range(1,46)), 'Sahne sırası hatalı'
          print('Kod ve hikâye kontrolleri başarılı.')
          PY

      - name: YouTube OAuth ön kontrolü
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          keys=['YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN']
          missing=[k for k in keys if not os.getenv(k,'').strip()]
          if missing: raise SystemExit('Eksik GitHub Secrets: '+', '.join(missing))
          r=requests.post('https://oauth2.googleapis.com/token',data={
            'grant_type':'refresh_token','client_id':os.environ['YOUTUBE_CLIENT_ID'],
            'client_secret':os.environ['YOUTUBE_CLIENT_SECRET'],'refresh_token':os.environ['YOUTUBE_REFRESH_TOKEN']},timeout=30)
          j=r.json()
          if not r.ok or not j.get('access_token'): raise SystemExit('YouTube OAuth başarısız: '+str(j.get('error_description',j.get('error'))))
          print('YouTube OAuth bağlantısı başarılı.')
          PY

      - name: Video üret ve yayınla
        working-directory: KORKU_MOTORU
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-4b'
          IMAGE_WORKERS: '4'
          TTS_VOICE: 'tr-TR-AhmetNeural'
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python run.py

      # Bu adım hata olsa bile tamamlanan görselleri/klipleri sonraki çalıştırmaya taşır.
      - name: Üretim önbelleğini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            KORKU_MOTORU/output/images/
            KORKU_MOTORU/output/clips/
          key: korku-motoru-${{ hashFiles('KORKU_MOTORU/korku_motoru/stories/*.json') }}-${{ github.run_id }}

      - name: Çıktıları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korku-motoru-output-${{ github.run_id }}
          path: KORKU_MOTORU/output/
          if-no-files-found: ignore
          retention-days: 7

      # Yayın geçmişi kalıcı olmalı; aksi halde aynı bölüm ertesi gün yeniden yüklenebilir.
      - name: Yayın geçmişini depoya kaydet
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f KORKU_MOTORU/data/history.json
          git diff --cached --quiet || git commit -m 'Korku Motoru: yayın geçmişi güncellendi'
          git push
